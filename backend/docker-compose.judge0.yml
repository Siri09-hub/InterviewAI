services:
  server:
    image: judge0/judge0:1.13.0
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    restart: always

  workers:
    image: judge0/judge0:1.13.0
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    restart: always

  db:
    image: postgres:13.0
    env_file:
      - judge0.conf
    volumes:
      - judge0_postgres_data:/var/lib/postgresql/data/
    restart: always

  redis:
    image: redis:6.0
    command:
      [
        "bash",
        "-c",
        "docker-entrypoint.sh --appendonly no --requirepass \"$$REDIS_PASSWORD\""
      ]
    env_file:
      - judge0.conf
    restart: always

volumes:
  judge0_postgres_data: